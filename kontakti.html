<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/pages.css">
    <title>Kontakti</title>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-btn">Sākums</a>
        <a href="parmani.html" class="nav-btn">Par Mani</a>
        <a href="prasmes.html" class="nav-btn">Prasmes</a>
        <a href="projekti.html" class="nav-btn">Projekti</a>
    </nav>

    <div id="particles-js"></div>

    <div class="name">
        <div class="box">
            <h3 class="fcf-h3">Sazinies ar mani</h3>

    <form id="fcf-form-id" class="fcf-form-class" method="post" action="https://api.web3forms.com/submit">

        <input type="hidden" name="access_key" value="4d69d129-8de2-4f9e-9555-2ea38172fb16">
        <input type="hidden" name="subject" value="Jauna ziņa no vietnes">
        <input type="hidden" name="redirect" value="https://YOUR-VERCEL-DOMAIN.vercel.app/paldies.html">
        <input type="checkbox" name="botcheck" style="display: none;" tabindex="-1" autocomplete="off">

        <div class="fcf-form-group">
            <label for="Name" class="fcf-label">Jūsu vārds</label>
            <div class="fcf-input-group">
                <input type="text" id="Name" name="name" class="fcf-form-control" placeholder="Jānis Bērziņš" required>
            </div>
        </div>

        <div class="fcf-form-group">
            <label for="Email" class="fcf-label">Jūsu e-pasta adrese</label>
            <div class="fcf-input-group">
                <input type="email" id="Email" name="email" class="fcf-form-control" placeholder="jusu@epasts.lv" required>
            </div>
        </div>

        <div class="fcf-form-group">
            <label for="Message" class="fcf-label">Jūsu ziņa</label>
            <div class="fcf-input-group">
                <textarea id="Message" name="message" class="fcf-form-control" rows="6" maxlength="3000" placeholder="Raksti savu ziņu šeit..." required></textarea>
            </div>
        </div>

        <div class="fcf-form-group">
            <button type="submit" id="fcf-button" class="fcf-btn fcf-btn-primary fcf-btn-lg fcf-btn-block">Nosūtīt ziņu</button>
        </div>
    </form>
        </div>
    </div>

    <script src="particles.js"></script>
    <script src="app.js"></script>

</body>
</html>
